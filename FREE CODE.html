<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>glow</title>
        <style>
            @import url(https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap);
            *,
            *::before,
            *::after{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body{
                block-size: 100vh;
                display: grid;
                place-content: center;
                gap: 1rem;
                font-family: "Lato",sans-serif;
                background-color: #efefef;
            }
            .text-container{
                display: flex;
                justify-content: center;
                block-size: min(10rem,23vw);
                min-inline-size: 22.5rem;
            }
            .text-stroke{
                font-size: 92px;
                letter-spacing: 4px;
                fill: none;
                stroke: #dc2727;
                stroke-width: 2;
                stroke-dasharray: 100%;
                stroke-dashoffset: 100%;
                animation: textStrokeAnim 4000ms linear both;
                animation-iteration-count: 5;
            }

            @keyframes textStrokeAnim{
                0%{
                    stroke-dasharray: 100%;
                    stroke-dashoffset: 100%;
                    fill: #0000;
                }
                95%{
                    stroke-dasharray: 0%;
                    stroke-dashoffset: 90%;
                    fill: #0000;
                }
                100%{
                    stroke-dasharray: 0%;
                    stroke-dashoffset: 0%;
                }
            }
        </style>
    </head>
    <body>
        <main class="text-container">
            <svg class="text-stroke" viewBox="0 0 500 100" widdth="80%" height="100%">
                <text class="text" x="20" y="95">Paradise</text>
            </svg>
        </main>
    </body>
